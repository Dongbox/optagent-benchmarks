name: Run OptAgent Benchmarks

on:
  workflow_dispatch:
    inputs:
      optagent_repository:
        description: OptAgent repository, owner/name
        required: true
        default: Dongbox/optagent
      optagent_ref:
        description: OptAgent commit SHA or ref to benchmark
        required: true
      tier:
        description: Benchmark tier or comma-separated tiers
        required: false
        default: smoke
      family:
        description: Benchmark family or comma-separated families
        required: false
        default: sequence_blackbox_tsp
      strategy:
        description: Benchmark strategy or comma-separated strategies
        required: false
        default: ga
      max_iterations:
        description: Max iterations budget
        required: false
        default: ""
      time_limit_s:
        description: Time limit seconds budget
        required: false
        default: "2"
      population_size:
        description: Population size budget
        required: false
        default: "16"
      calibration_seeds:
        description: Comma-separated calibration seeds
        required: false
        default: "11,59,113"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-benchmarks.yml"
      - "benchmark.py"
      - "benchmarks/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: optagent-benchmark-results
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark OptAgent Commit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPTAGENT_REPOSITORY: ${{ inputs.optagent_repository || 'Dongbox/optagent' }}
      OPTAGENT_REF: ${{ inputs.optagent_ref || 'main' }}
      BENCHMARK_TIER: ${{ inputs.tier || 'smoke' }}
      BENCHMARK_FAMILY: ${{ inputs.family || 'sequence_blackbox_tsp' }}
      BENCHMARK_STRATEGY: ${{ inputs.strategy || 'ga' }}
      BENCHMARK_MAX_ITERATIONS: ${{ inputs.max_iterations || '' }}
      BENCHMARK_TIME_LIMIT_S: ${{ inputs.time_limit_s || '20' }}
      BENCHMARK_POPULATION_SIZE: ${{ inputs.population_size || '16' }}
      BENCHMARK_CALIBRATION_SEEDS: ${{ inputs.calibration_seeds || '11,59,113' }}
      OPTAGENT_REPOSITORY_TOKEN: ${{ secrets.OPTAGENT_REPOSITORY_TOKEN }}
    steps:
      - name: Checkout optagent-benchmarks
        uses: actions/checkout@v7
        with:
          path: benchmarks

      - name: Validate private OptAgent checkout token
        if: ${{ env.OPTAGENT_REPOSITORY != github.repository && env.OPTAGENT_REPOSITORY_TOKEN == '' }}
        run: |
          echo "OPTAGENT_REPOSITORY_TOKEN is required when benchmarking a private or cross-repository OptAgent checkout: ${OPTAGENT_REPOSITORY}" >&2
          exit 1

      - name: Checkout OptAgent
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OPTAGENT_REPOSITORY }}
          ref: ${{ env.OPTAGENT_REF }}
          path: optagent
          token: ${{ env.OPTAGENT_REPOSITORY_TOKEN || github.token }}
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: optagent/pyproject.toml

      - name: Resolve OptAgent commit SHA
        working-directory: optagent
        run: |
          set -euo pipefail
          echo "Checked out OptAgent ref: ${OPTAGENT_REF}"
          echo "OPTAGENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Resolved OptAgent SHA: $(git rev-parse HEAD)"

      - name: Cache OptAgent native wheel build tree
        uses: actions/cache@v5
        with:
          path: optagent/build/wheel-cache/benchmark-linux-py312
          key: optagent-benchmark-native-wheel-v2-linux-py312-${{ env.OPTAGENT_SHA }}

      - name: Build OptAgent wheel
        working-directory: optagent
        run: |
          set -euo pipefail
          rm -rf dist/benchmark
          python -m pip install --upgrade pip build scikit-build-core pybind11 setuptools wheel
          python -m pip wheel . -w dist/benchmark --no-deps -Cbuild-dir=build/wheel-cache/benchmark-linux-py312
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          wheels = sorted(Path("dist/benchmark").glob("optagent-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one OptAgent wheel, found {len(wheels)}: {wheels}")
          print(f"OPTAGENT_WHEEL={wheels[0].resolve()}")
          PY

      - name: Install benchmark runtime
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install "${OPTAGENT_WHEEL}"

      - name: Capture benchmark metadata
        working-directory: benchmarks
        run: |
          echo "BENCHMARKS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CREATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import hashlib
          import importlib.metadata
          import os
          from pathlib import Path

          wheel = Path(os.environ["OPTAGENT_WHEEL"])
          print(f"OPTAGENT_WHEEL_SHA256=sha256:{hashlib.sha256(wheel.read_bytes()).hexdigest()}")
          print(f"OPTAGENT_VERSION={importlib.metadata.version('optagent')}")
          PY

      - name: Run benchmark suite
        working-directory: benchmarks
        run: |
          RUN_ARGS=()
          IFS=',' read -ra FAMILIES <<< "${BENCHMARK_FAMILY}"
          for family in "${FAMILIES[@]}"; do
            family="$(echo "${family}" | xargs)"
            if [ -n "${family}" ]; then
              RUN_ARGS+=(--family "${family}")
            fi
          done
          IFS=',' read -ra STRATEGIES <<< "${BENCHMARK_STRATEGY}"
          for strategy in "${STRATEGIES[@]}"; do
            strategy="$(echo "${strategy}" | xargs)"
            if [ -n "${strategy}" ]; then
              RUN_ARGS+=(--strategy "${strategy}")
            fi
          done
          IFS=',' read -ra TIERS <<< "${BENCHMARK_TIER}"
          for tier in "${TIERS[@]}"; do
            tier="$(echo "${tier}" | xargs)"
            if [ -n "${tier}" ]; then
              RUN_ARGS+=(--tier "${tier}")
            fi
          done
          IFS=',' read -ra SEEDS <<< "${BENCHMARK_CALIBRATION_SEEDS}"
          for seed in "${SEEDS[@]}"; do
            seed="$(echo "${seed}" | xargs)"
            if [ -n "${seed}" ]; then
              RUN_ARGS+=(--calibration-seed "${seed}")
            fi
          done
          python benchmark.py suite \
            "${RUN_ARGS[@]}" \
            --time-limit-s "${BENCHMARK_TIME_LIMIT_S}" \
            --population-size "${BENCHMARK_POPULATION_SIZE}" \
            --timestamp "gha-${OPTAGENT_REF:0:12}-${GITHUB_RUN_ID}"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          runs = sorted(Path("docs/evals/benchmark-suite/runs").glob("gha-*"))
          if not runs:
              raise SystemExit("no benchmark run directory found")
          print(f"BENCHMARK_RUN_DIR={runs[-1].resolve()}")
          PY

      - name: Publish canonical telemetry artifact
        working-directory: benchmarks
        run: |
          ARTIFACT_ID="gha-${OPTAGENT_SHA:0:12}-${GITHUB_RUN_ID}"
          ARTIFACT_DIR="artifacts/telemetry/${ARTIFACT_ID}"
          python benchmark.py publish-telemetry \
            --suite-run "${BENCHMARK_RUN_DIR}" \
            --output-dir "${ARTIFACT_DIR}" \
            --created-at "${CREATED_AT}" \
            --optagent-commit "${OPTAGENT_SHA}" \
            --benchmarks-commit "${BENCHMARKS_COMMIT}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_id = f"gha-{os.environ['OPTAGENT_SHA'][:12]}-{os.environ['GITHUB_RUN_ID']}"
          latest = {
              "schema_version": 1,
              "artifact_id": artifact_id,
              "artifact_path": f"artifacts/telemetry/{artifact_id}",
              "created_at": os.environ["CREATED_AT"],
              "optagent_commit": os.environ["OPTAGENT_SHA"],
              "benchmarks_commit": os.environ["BENCHMARKS_COMMIT"],
          }
          path = Path("artifacts/telemetry/latest.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(latest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Publish static review bundle
        working-directory: benchmarks
        run: |
          ARTIFACT_ID="gha-${OPTAGENT_SHA:0:12}-${GITHUB_RUN_ID}"
          python benchmark.py publish-review \
            --current-artifact "artifacts/telemetry/${ARTIFACT_ID}" \
            --output-dir "artifacts/reviews/${ARTIFACT_ID}" \
            --protocol-id "suite-${BENCHMARK_TIER}-v1" \
            --created-at "${CREATED_AT}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_id = f"gha-{os.environ['OPTAGENT_SHA'][:12]}-{os.environ['GITHUB_RUN_ID']}"
          latest = {
              "schema_version": 1,
              "artifact_id": artifact_id,
              "artifact_path": f"artifacts/reviews/{artifact_id}",
              "created_at": os.environ["CREATED_AT"],
              "optagent_commit": os.environ["OPTAGENT_SHA"],
              "benchmarks_commit": os.environ["BENCHMARKS_COMMIT"],
          }
          path = Path("artifacts/reviews/latest.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(latest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Commit telemetry and review artifacts
        working-directory: benchmarks
        run: |
          git add artifacts/telemetry artifacts/reviews
          if git diff --cached --quiet -- artifacts/telemetry artifacts/reviews; then
            echo "No benchmark artifact changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add review artifact for ${OPTAGENT_SHA:0:12}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Dispatch dashboard deploy
        env:
          GH_TOKEN: ${{ secrets.OPTAGENT_DASHBOARD_WORKFLOW_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "OPTAGENT_DASHBOARD_WORKFLOW_TOKEN is not set; skipping dashboard dispatch."
            exit 0
          fi
          gh workflow run deploy-dashboard.yml \
            --repo Dongbox/optagent-dashboard \
            --ref main \
            -f benchmark_ref="${GITHUB_REF_NAME}"
