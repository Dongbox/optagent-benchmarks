name: Run OptAgent Benchmarks

on:
  workflow_dispatch:
    inputs:
      optagent_repository:
        description: OptAgent repository, owner/name
        required: true
        default: Dongbox/optagent
      optagent_ref:
        description: OptAgent commit SHA or ref to benchmark
        required: true
      tier:
        description: Benchmark tier
        required: false
        default: smoke
      family:
        description: Benchmark family
        required: false
        default: sequence_blackbox_tsp
      strategy:
        description: Benchmark strategy
        required: false
        default: ga
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-benchmarks.yml"
      - "catalog/**"
      - "definitions/**"
      - "loaders/**"
      - "models/**"
      - "runners/**"
      - "results/**"
      - "aggregates/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: optagent-benchmark-results
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark OptAgent Commit
    runs-on: ubuntu-latest
    env:
      OPTAGENT_REPOSITORY: ${{ inputs.optagent_repository || 'Dongbox/optagent' }}
      OPTAGENT_REF: ${{ inputs.optagent_ref || 'main' }}
      BENCHMARK_TIER: ${{ inputs.tier || 'smoke' }}
      BENCHMARK_FAMILY: ${{ inputs.family || 'sequence_blackbox_tsp' }}
      BENCHMARK_STRATEGY: ${{ inputs.strategy || 'ga' }}
    steps:
      - name: Checkout optagent-benchmarks
        uses: actions/checkout@v4
        with:
          path: benchmarks

      - name: Checkout OptAgent
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPTAGENT_REPOSITORY }}
          ref: ${{ env.OPTAGENT_REF }}
          path: optagent
          token: ${{ secrets.OPTAGENT_REPOSITORY_TOKEN || github.token }}
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build OptAgent wheel
        working-directory: optagent
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel produced")
          print(f"OPTAGENT_WHEEL={wheels[-1].resolve()}")
          PY

      - name: Install benchmark runtime
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install "${OPTAGENT_WHEEL}"

      - name: Capture benchmark metadata
        working-directory: benchmarks
        run: |
          echo "BENCHMARKS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CREATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import hashlib
          import importlib.metadata
          import os
          from pathlib import Path

          wheel = Path(os.environ["OPTAGENT_WHEEL"])
          print(f"OPTAGENT_WHEEL_SHA256=sha256:{hashlib.sha256(wheel.read_bytes()).hexdigest()}")
          print(f"OPTAGENT_VERSION={importlib.metadata.version('optagent')}")
          PY

      - name: Run smoke benchmark
        run: |
          python -m benchmarks.runners.run \
            --family "${BENCHMARK_FAMILY}" \
            --tier "${BENCHMARK_TIER}" \
            --strategy "${BENCHMARK_STRATEGY}" \
            --max-iterations 2 \
            --time-limit-s 1 \
            --population-size 4 \
            --timestamp "gha-${OPTAGENT_REF:0:12}-${GITHUB_RUN_ID}"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          runs = sorted(Path("docs/evals/benchmark-suite/runs").glob("gha-*"))
          if not runs:
              raise SystemExit("no benchmark run directory found")
          print(f"BENCHMARK_RUN_DIR={runs[-1].resolve()}")
          PY

      - name: Publish dashboard JSON
        run: |
          python -m benchmarks.runners.publish_dashboard_results "${BENCHMARK_RUN_DIR}" \
            --optagent-version "${OPTAGENT_VERSION}" \
            --optagent-commit "${OPTAGENT_REF}" \
            --optagent-commit-url "https://github.com/${OPTAGENT_REPOSITORY}/commit/${OPTAGENT_REF}" \
            --optagent-wheel-sha256 "${OPTAGENT_WHEEL_SHA256}" \
            --benchmarks-commit "${BENCHMARKS_COMMIT}" \
            --benchmarks-commit-url "https://github.com/${GITHUB_REPOSITORY}/commit/${BENCHMARKS_COMMIT}" \
            --created-at "${CREATED_AT}"

      - name: Commit benchmark result updates
        working-directory: benchmarks
        run: |
          if git diff --quiet -- results aggregates; then
            echo "No dashboard result changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results aggregates
          git commit -m "Add benchmark dashboard results for ${OPTAGENT_REF:0:12}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          cd ..
          python -m benchmarks.runners.generate_dashboard_data
          cd benchmarks
          git add results/index.json aggregates
          git commit --amend --no-edit
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Dispatch dashboard deploy
        env:
          GH_TOKEN: ${{ secrets.OPTAGENT_DASHBOARD_WORKFLOW_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "OPTAGENT_DASHBOARD_WORKFLOW_TOKEN is not set; skipping dashboard dispatch."
            exit 0
          fi
          gh workflow run deploy-dashboard.yml \
            --repo Dongbox/optagent-dashboard \
            --ref main \
            -f benchmark_ref="${GITHUB_REF_NAME}"
